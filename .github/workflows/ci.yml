name: CI (grace.tr)

# Build check only — this workflow does NOT deploy.
#
# It used to rsync dist/ to production on every push to main. That path had no backup,
# no rollback, no check that the upload arrived intact, and did not re-run prerender, so
# it could ship stale snapshots. Production is deployed by hand with scripts/deploy.sh,
# which does all of those (2026-09-26). The TENCENT_DEPLOY_KEY repository secret is no
# longer used by anything here and can be deleted from the repo settings.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build (with prerender injection)
        run: npm run build
        # npm run build = vite build + apply-prerender + sitemap + 404.
        # prerendered/routes.json is committed — no Chromium needed in CI, and
        # apply-prerender fails the build if any manifest route has no snapshot.

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
